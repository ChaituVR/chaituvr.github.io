<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaitu — governance infrastructure engineer</title>
<meta name="description" content="Chaitu builds the rails DAOs vote on. Ten years shipping software, six on Snapshot's core team. Voting power, delegation, signatures, agents.">
<meta property="og:title" content="Chaitu — governance infrastructure engineer">
<meta property="og:description" content="Ten years shipping software, six on Snapshot's core team. Voting power, delegation, signatures, agents.">
<meta property="og:url" content="https://chaituvr.github.io/">
<meta name="theme-color" content="#2A2BFF">
<link rel="icon" href="/images/favicons/favicon-96x96.png" type="image/png">
<link rel="apple-touch-icon" href="/images/favicons/apple-icon-180x180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #2A2BFF;
    --coral: #FF6A3D;
    --peach: #FFD3B8;
    --yellow: #F7EC4F;
    --navy: #0E0F5C;
    --white: #FFFFFF;
    --pad: clamp(1.25rem, 4vw, 3.5rem);
    --ease: cubic-bezier(.2,.9,.2,1);
    --spring: cubic-bezier(.34,1.5,.64,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: var(--blue); color: var(--white); }
  body {
    margin: 0; overflow: hidden;
    font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, system-ui, sans-serif;
    font-variation-settings: "opsz" 24, "wdth" 100, "wght" 400;
    font-size: clamp(1rem, 1.1vw + 0.6rem, 1.2rem);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 4px; border-radius: 999px; }

  .stage { position: relative; height: 100svh; isolation: isolate; display: grid; grid-template-rows: 1fr auto; }
  #tunnel { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; touch-action: none; cursor: grab; }
  #tunnel:active { cursor: grabbing; }
  .fallback {
    position: absolute; inset: 0; z-index: -2;
    background: radial-gradient(circle at 62% 45%, var(--white) 0, var(--peach) 8%, var(--coral) 30%, var(--blue) 65%);
  }
  .stage::after {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(to top, rgba(14, 15, 92, 0.8) 0%, rgba(14, 15, 92, 0.3) 40%, transparent 65%);
  }

  .views { position: relative; pointer-events: none; }
  .view {
    position: absolute; inset: auto var(--pad) clamp(1rem, 4vh, 2.5rem) var(--pad);
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; max-width: 68rem;
    visibility: hidden;
  }
  .view.on { visibility: visible; }
  .view > * { pointer-events: auto; }
  .view.on > * { animation: rise 0.9s var(--ease) both; animation-delay: calc(var(--i, 0) * 90ms); }
  .view.off > * { animation: sink 0.35s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(1.2rem); } to { opacity: 1; transform: none; } }
  @keyframes sink { to { opacity: 0; transform: translateY(-0.8rem); } }

  .kinetic {
    margin: 0; line-height: 0.88; letter-spacing: -0.045em;
    font-variation-settings: "opsz" 96, "wdth" 100, "wght" 800;
    display: flex; flex-wrap: wrap; column-gap: 0.22em;
  }
  .kinetic i { display: inline-flex; font-style: normal; }
  .kinetic span {
    display: inline-block; opacity: 0; transform: translateY(0.25em);
    font-variation-settings: "opsz" 96, "wdth" 75, "wght" 200;
    animation: letter 1s var(--ease) forwards, breathe 2.4s ease-in-out infinite alternate;
    animation-delay: calc(var(--i) * 45ms + 80ms), calc(var(--i) * 120ms + 1.1s);
    transition: color 0.3s;
  }
  .kinetic span:hover { color: var(--yellow); animation-play-state: paused; }
  @keyframes letter { to { opacity: 1; transform: none; font-variation-settings: "opsz" 96, "wdth" 100, "wght" 800; } }
  @keyframes breathe {
    from { opacity: 1; transform: none; font-variation-settings: "opsz" 96, "wdth" 100, "wght" 800; }
    to { opacity: 1; transform: translateY(-0.05em); font-variation-settings: "opsz" 96, "wdth" 90, "wght" 560; }
  }
  .name { font-size: clamp(4.5rem, 17vw, 14rem); }
  .head { font-size: clamp(2.4rem, 7.5vw, 6rem); }
  .lead {
    margin: 0; max-width: 36rem;
    font-size: clamp(1.15rem, 2.2vw, 1.7rem); line-height: 1.25; letter-spacing: -0.015em;
    font-variation-settings: "opsz" 48, "wdth" 95, "wght" 500;
  }
  #view-name .lead { max-width: 41rem; }
  .lead a { text-decoration-thickness: 2px; text-underline-offset: 0.15em; color: var(--yellow); }
  .role {
    margin: 0; color: var(--yellow); letter-spacing: -0.01em;
    font-size: clamp(1.1rem, 1.8vw, 1.5rem); font-variation-settings: "opsz" 48, "wdth" 92, "wght" 650;
  }

  .pill {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 1.05rem; border-radius: 999px; text-decoration: none; white-space: nowrap;
    background: rgba(255,255,255,0.14); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid rgba(255,255,255,0.3); font-variation-settings: "opsz" 24, "wdth" 95, "wght" 550;
    transition: background 0.25s, color 0.25s, transform 0.3s var(--ease); will-change: transform;
  }
  .pill:hover { background: rgba(255,255,255,0.3); }
  .pill[aria-pressed="true"] { background: var(--white); color: var(--navy); border-color: var(--white); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .cos {
    position: fixed; top: clamp(0.75rem, 2.5vh, 1.5rem); left: 0; right: 0; padding: 0.35rem var(--pad);
    display: flex; align-items: center; gap: 0.6rem;
    overflow-x: auto; scrollbar-width: none; cursor: grab; user-select: none; -webkit-user-select: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--pad), #000 calc(100% - var(--pad)), transparent);
    mask-image: linear-gradient(90deg, transparent, #000 var(--pad), #000 calc(100% - var(--pad)), transparent);
  }
  .cos::-webkit-scrollbar { display: none; }
  .cos > * { flex: none; }
  .cos.dragging { cursor: grabbing; }
  .dragging .pill { pointer-events: none; transition: none; }
  .cos .role { margin-right: 0.2rem; }
  .cos .role + .role { margin-left: 0.4rem; }
  .co { position: relative; padding: 0.45rem 0.95rem 0.45rem 0.6rem; gap: 0.5rem; }
  .co img, .co svg { width: 1.4em; height: 1.4em; border-radius: 50%; flex: none; }
  .co.mark { padding-left: 0.9rem; }
  .co.mark svg { width: auto; height: 0.95em; border-radius: 0; }
  .co .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .co small { font-size: 0.82em; opacity: 0.7; font-variation-settings: "opsz" 24, "wdth" 92, "wght" 500; }
  .co[aria-pressed="true"] { background: var(--yellow); color: var(--navy); border-color: var(--yellow); }
  .view.on .chips .pill, .view.on .cos .pill, .view.on .ways .pill {
    animation: pop 0.7s var(--spring) backwards; animation-delay: calc(var(--i, 0) * 60ms + 250ms);
  }
  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .tag {
    padding: 0.25rem 0.65rem; border-radius: 999px; font-size: 0.85rem; white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.4); background: rgba(14,15,92,0.35);
    font-variation-settings: "opsz" 24, "wdth" 92, "wght" 550;
    animation: pop 0.6s var(--spring) backwards; animation-delay: calc(var(--i) * 50ms + 150ms);
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  .marquee {
    width: 100vw; margin-left: calc(-1 * var(--pad)); overflow: hidden; display: flex;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
  }
  .marquee .track { display: flex; gap: 0.4rem; padding-right: 0.4rem; flex: none; animation: slide 55s linear infinite; }
  .marquee:hover .track { animation-play-state: paused; }
  .marquee .tag { animation: none; }
  @keyframes slide { to { transform: translateX(-100%); } }
  .pill.done { background: var(--yellow); color: var(--navy); border-color: var(--yellow); }
  .ways { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .ways .pill { font-size: clamp(1rem, 1.5vw, 1.25rem); padding: 0.8rem 1.3rem; }
  .ways .pill:hover { background: var(--white); color: var(--navy); }

  .wipe {
    position: fixed; inset: -10% -30%; z-index: 5; pointer-events: none; opacity: 0;
    background: linear-gradient(100deg, transparent 32%, var(--peach) 44%, var(--yellow) 50%, var(--coral) 56%, transparent 68%);
  }
  .wipe.go { animation: wipe 0.7s cubic-bezier(.7,0,.2,1) both; }
  @keyframes wipe {
    from { opacity: 1; transform: translateX(-100%) skewX(-12deg); }
    to { opacity: 1; transform: translateX(100%) skewX(-12deg); }
  }

  .hi-card {
    position: fixed; z-index: 6; left: 50%; top: 40%; width: min(24rem, 78vw); cursor: pointer;
    translate: -50% -50%; rotate: -4deg; border-radius: 1.25rem; overflow: hidden;
    border: 4px solid var(--white); background: var(--navy);
    box-shadow: 0 30px 80px rgba(14,15,92,0.55);
  }
  .hi-card img { display: block; width: 100%; height: auto; }
  .hi-card.in { animation: cardIn 0.7s var(--spring) both; }
  .hi-card.out { animation: cardOut 0.3s var(--ease) both; }
  @keyframes cardIn { from { opacity: 0; scale: 0.4; rotate: 12deg; } to { opacity: 1; scale: 1; rotate: -4deg; } }
  @keyframes cardOut { to { opacity: 0; scale: 0.7; rotate: 6deg; } }
  .burst { position: fixed; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
  .burst span {
    position: absolute; left: 0; top: 0; line-height: 1; white-space: nowrap;
    font-variation-settings: "opsz" 96, "wdth" 100, "wght" 800;
    animation: fly 1.4s cubic-bezier(.15,.8,.3,1) forwards;
  }
  @keyframes fly {
    from { opacity: 1; transform: translate(var(--x), var(--y)) scale(0.2) rotate(0deg); }
    60% { opacity: 1; }
    to { opacity: 0; transform: translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy))) scale(1) rotate(var(--rot)); }
  }
  @media (min-width: 60rem) { .hi-card { left: 64%; top: 44%; } }

  .dock { display: flex; justify-content: center; padding: 0 var(--pad) clamp(1rem, 3vh, 1.75rem); }
  .seg {
    position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    padding: 0.3rem; border-radius: 999px;
    background: rgba(14,15,92,0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1.5px solid rgba(255,255,255,0.25);
  }
  .seg::before {
    content: ""; position: absolute; top: 0.3rem; bottom: 0.3rem; left: 0.3rem;
    width: calc((100% - 0.6rem) / 3); border-radius: 999px; background: var(--white);
    transform: translateX(calc(var(--sel, 0) * 100%));
    transition: transform 0.55s var(--spring);
  }
  .seg button {
    position: relative; padding: 0.7rem 1.4rem; border-radius: 999px; white-space: nowrap;
    font-variation-settings: "opsz" 24, "wdth" 92, "wght" 600; transition: color 0.3s;
  }
  .seg button[aria-selected="true"] { color: var(--navy); }

  @media (prefers-reduced-motion: reduce) {
    .view.on > *, .view.off > *, .kinetic span, .tag, .view.on .pill, .wipe.go, .hi-card, .burst span,
    .marquee .track { animation: none; opacity: 1; transform: none; }
    .kinetic span { font-variation-settings: "opsz" 96, "wdth" 100, "wght" 800; transition: none; }
    .seg::before, .pill { transition: none; }
    .wipe { display: none; }
    .marquee .track { flex-wrap: wrap; }
    .marquee .track + .track { display: none; }
  }
  @media (max-width: 40rem) {
    .seg button { padding: 0.65rem 0.9rem; }
    .view { gap: 0.8rem; }
    .chips {
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; cursor: grab; user-select: none; -webkit-user-select: none;
      width: 100vw; margin-left: calc(-1 * var(--pad)); padding: 0.25rem var(--pad);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
    }
    .chips::-webkit-scrollbar { display: none; }
    .chips .pill { flex: none; }
    .chips.dragging { cursor: grabbing; }
  }
  @media (max-height: 30rem) { .name { font-size: clamp(3rem, 12vh, 6rem); } }
</style>
</head>
<body>

<main class="stage" id="stage">
  <canvas id="tunnel" aria-label="Animated gradient tunnel. Click for a ripple, hold to speed up."></canvas>
  <div class="fallback" aria-hidden="true" hidden></div>

  <div class="views">
    <section class="view on" id="view-name" aria-labelledby="name-h">
      <p class="role" style="--i:0">Hey, I'm</p>
      <h1 class="kinetic name" id="name-h" style="--i:1" data-text="Chaitu"></h1>
      <p class="lead" style="--i:2">Ten years shipping software, six on Snapshot's core team. I build the rails DAOs vote on: voting power, delegation, signatures, and now the agents that use them.</p>
      <div class="marquee" id="stack" style="--i:3" aria-label="Stack"></div>
    </section>

    <section class="view" id="view-work" aria-labelledby="work-h" hidden>
      <div class="cos" id="cos" role="group" aria-label="Companies" style="--i:0"><span class="role">Work at</span></div>
      <h2 class="kinetic head" id="work-h" style="--i:1" data-text=""></h2>
      <p class="lead" id="work-desc" style="--i:2"></p>
      <div class="tags" id="work-tags" style="--i:3" aria-label="Technologies"></div>
      <div class="chips" id="chips" role="group" aria-label="Areas of work" style="--i:4"></div>
    </section>

    <section class="view" id="view-hi" aria-labelledby="hi-h" hidden>
      <h2 class="kinetic head" id="hi-h" style="--i:0" data-text="Say hi."></h2>
      <p class="lead" style="--i:1">Remote, IST, fast replies. DMs open.</p>
      <div class="ways" id="ways" style="--i:2">
        <a class="pill" style="--i:0" href="https://t.me/chaituvr" target="_blank" rel="noopener">Telegram</a>
        <a class="pill" style="--i:1" href="https://x.com/chaituvr_s" target="_blank" rel="noopener">X</a>
        <a class="pill" style="--i:2" href="https://linkedin.com/in/chaituvr" target="_blank" rel="noopener">LinkedIn</a>
        <a class="pill" style="--i:3" href="https://github.com/ChaituVR" target="_blank" rel="noopener">GitHub</a>
        <button class="pill" style="--i:4" type="button" id="copy" data-email="schaituvr@gmail.com">Copy email</button>
      </div>
    </section>
  </div>

  <div class="wipe" id="wipe" aria-hidden="true"></div>
  <div class="burst" id="burst" aria-hidden="true"></div>

  <nav class="dock" aria-label="Sections">
    <div class="seg" role="tablist" id="seg" style="--sel:0">
      <button role="tab" aria-selected="true" data-view="name">Chaitu</button>
      <button role="tab" aria-selected="false" data-view="work">Work</button>
      <button role="tab" aria-selected="false" data-view="hi">Say hi</button>
    </div>
  </nav>

</main>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);

  /* Kinetic text: one span per letter, words kept together */
  const setText = (el, text) => {
    el.replaceChildren();
    let i = 0;
    text.split(' ').forEach((word, w) => {
      const box = document.createElement('i');
      for (const ch of word) {
        const s = document.createElement('span');
        s.textContent = ch;
        s.style.setProperty('--i', i++);
        box.append(s);
      }
      el.append(box);
    });
    el.setAttribute('aria-label', text);
  };
  document.querySelectorAll('.kinetic[data-text]').forEach(el => { if (el.dataset.text) setText(el, el.dataset.text); });

  /* Stack marquee: two identical tracks for a seamless loop */
  const stack = ['TypeScript', 'Node.js', 'Vue', 'Vite', 'GraphQL', 'Express', 'MySQL', 'Postgres', 'Redis', 'Solidity', 'Cairo', 'Ethereum', 'Starknet', 'Arbitrum', 'The Graph', 'Checkpoint', 'ethers.js', 'viem', 'starknet.js', 'EIP-712', 'MCP', 'Zod', 'Docker', 'GitHub Actions', 'AWS S3', 'IPFS', 'Playwright', 'Vitest', 'Tailwind', 'React'];
  $('#stack').replaceChildren(...[0, 1].map(() => {
    const track = document.createElement('div');
    track.className = 'track';
    track.replaceChildren(...stack.map(name => {
      const s = document.createElement('span');
      s.className = 'tag'; s.textContent = name;
      return s;
    }));
    return track;
  }));

  const replay = (el) => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; };

  /* Tunnel */
  const scenes = {
    name: { a: [0.165, 0.17, 1.0], b: [1.0, 0.42, 0.24], twist: 3, speed: 1.0 },
    work: { a: [0.05, 0.5, 1.0], b: [1.0, 0.32, 0.55], twist: 5, speed: 1.35 },
    hi:   { a: [0.06, 0.06, 0.4], b: [1.0, 0.58, 0.36], twist: 2, speed: 0.55 }
  };
  const cur = { a: [...scenes.name.a], b: [...scenes.name.b], speed: 1 };
  const tw = { from: 3, to: 3, mix: 1 };
  let target = scenes.name;
  let kick = 0;
  let holding = false;
  const click = { x: 0, y: 0, t: -10 };

  const canvas = $('#tunnel');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' });
  let phase = 0, last = performance.now();
  if (!gl || reduce) {
    canvas.remove();
    $('.fallback').hidden = false;
  } else {
    const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
    const fs = `
      precision highp float;
      uniform vec2 u_res; uniform float u_time; uniform vec2 u_mouse;
      uniform vec3 u_a; uniform vec3 u_b; uniform vec3 u_twist; uniform vec3 u_click;
      float hash(float n) { return fract(sin(n) * 43758.5453); }
      void main() {
        vec2 uv0 = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
        vec2 uv = uv0; uv.x -= 0.18; uv -= u_mouse * 0.12;
        float r = length(uv);
        float a = atan(uv.y, uv.x);
        float t = u_time;
        float depth = 1.0 / (r + 0.06);
        float base = depth * 1.5 - t * 2.2 + sin(a * 2.0 + t * 0.7) * 0.9;
        float s1 = mix(sin(base + a * u_twist.x), sin(base + a * u_twist.y), u_twist.z);
        float s2 = sin(depth * 0.7 - t * 1.4 - a * 2.0 + 1.7);
        float band = smoothstep(-0.12, 0.12, s1);
        float band2 = smoothstep(-0.4, 0.4, s2);
        float edge = 1.0 - smoothstep(0.0, 0.45, abs(s1));
        vec3 peach = vec3(1.0, 0.83, 0.72);
        vec3 pink = vec3(1.0, 0.45, 0.75);
        vec3 col = mix(u_a, u_b, band);
        col = mix(col, pink, band2 * 0.3 * (1.0 - band));
        col = mix(col, peach, band * band2 * 0.35);
        col *= 1.0 - edge * 0.22;
        col = mix(col, peach, smoothstep(0.55, 0.0, r) * 0.7);
        col += vec3(1.0) * smoothstep(0.1, 0.0, r);
        float age = u_click.z;
        float d = length(uv0 - u_click.xy);
        float ring = smoothstep(0.05, 0.0, abs(d - age * 1.1)) * max(0.0, 1.0 - age * 0.9);
        col += vec3(1.0, 0.95, 0.85) * ring * 0.9;
        float lanes = 24.0;
        float ang = (a + 3.14159) / 6.28318 * lanes;
        float h = hash(floor(ang) * 7.13);
        float la = fract(ang) - 0.5;
        float z = fract(depth * 0.16 + t * (0.5 + h * 0.6) + h);
        float streak = smoothstep(0.1, 0.0, abs(la)) * smoothstep(0.14, 0.0, abs(z - 0.5));
        streak *= step(0.4, h) * smoothstep(0.1, 0.4, r) * (1.0 - smoothstep(0.9, 1.5, r));
        col += vec3(1.0, 0.97, 0.9) * streak * 0.6;
        col *= 1.0 - smoothstep(0.75, 1.6, r) * 0.35;
        col += (hash(dot(gl_FragCoord.xy, vec2(12.9898, 78.233)) + fract(t)) - 0.5) * 0.05;
        gl_FragColor = vec4(col, 1.0);
      }`;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = {};
    ['u_res', 'u_time', 'u_mouse', 'u_a', 'u_b', 'u_twist', 'u_click'].forEach(n => { U[n] = gl.getUniformLocation(prog, n); });

  let copyTimer = 0;
  copy.addEventListener('click', async () => {
    const email = copy.dataset.email;
    try {
      await navigator.clipboard.writeText(email);
    } catch (err) {
      location.href = 'mailto:' + email;
      return;
    }
    copy.textContent = 'Copied!';
    copy.classList.add('done');
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { copy.textContent = 'Copy email'; copy.classList.remove('done'); }, 2000);
  });
})();
</script>
</body>
</html>
